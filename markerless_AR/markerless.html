<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Markerless AR - Room Planner</title>

    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <link rel="stylesheet" href="../style/style.css">
    <script src="./interactions.js"></script>
  </head>

  <body>
    <!-- Selection UI -->
    <div id="selection-ui" class="selection-panel">
        <div class="selection-card">
            <h2>Room Planner</h2>
            <p class="selection-subtitle">Choose furniture, then place it in your room</p>

            <div class="category-grid">
                <button class="category-btn active" data-category="chair">Chair</button>
                <button class="category-btn" data-category="sofa">Sofa</button>
                <button class="category-btn" data-category="cupboard">Cupboard</button>
                <button class="category-btn" data-category="table">Table</button>
            </div>

            <div class="model-picker">
                <button id="prev-btn" class="nav-btn nav-btn-inline">&lt;</button>
                <div id="model-preview-text">chair_1.glb</div>
                <button id="next-btn" class="nav-btn nav-btn-inline">&gt;</button>
            </div>

            <div class="action-stack">
                <button id="start-ar-btn" class="main-btn">Start Markerless AR</button>
                <p id="ar-status">Use Chrome on Android over HTTPS to open the camera.</p>
                <a href="../index.html" class="main-btn secondary">Back to Dashboard</a>
            </div>
        </div>
    </div>

    <!-- AR Overlay -->
    <div id="ar-ui" class="ar-ui-layer" style="display: none;">
        <div class="ar-top-bar">
            <button id="exit-ar-btn" class="exit-ar-btn" type="button">Exit AR</button>
        </div>
        <div class="ar-bottom-bar">
            <button id="place-btn" class="place-btn" type="button">Place Furniture Here</button>
            <p class="ar-hint" id="gesture-hint" style="display: none;">Drag to rotate · Pinch to scale</p>
        </div>
    </div>

    <audio id="placement-sound" preload="auto" src="../assets/audio/place-furniture.mp3"></audio>

    <!-- WebXR Scene -->
    <a-scene
        webxr="requiredFeatures: hit-test; optionalFeatures: local-floor, local, dom-overlay; overlayElement: #ar-ui;"
        renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        markerless-placement
    >
        <a-camera position="0 1.6 0"></a-camera>

        <a-entity id="reticle" visible="false">
            <a-ring color="#e94560" radius-inner="0.1" radius-outer="0.15" rotation="-90 0 0"></a-ring>
        </a-entity>

        <a-gltf-model
            id="placed-model"
            position="0 0 0"
            scale="0 0 0"
            gesture-handler="placementMode: true"
        ></a-gltf-model>
    </a-scene>
  </body>
</html>
