<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Scan Catalogue - AR</title>

    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="../style/style.css">
    <script src="./marker-ui.js"></script>
  </head>

  <body>
    <div class="ar-ui-layer marker-ar-ui">
        <div class="ar-top-bar marker-ar-top">
            <a href="../index.html" class="exit-ar-btn">Back</a>
            <div id="detected-category" class="detected-label">Scan a marker to begin</div>
        </div>

        <button id="prev-btn" class="nav-btn nav-btn-side left" aria-label="Previous model">&lt;</button>
        <button id="next-btn" class="nav-btn nav-btn-side right" aria-label="Next model">&gt;</button>

        <div class="ar-bottom-bar marker-ar-bottom">
            <div class="marker-model-nav">
                <button id="prev-btn-mobile" class="nav-btn nav-btn-inline" aria-label="Previous model">&lt;</button>
                <span id="model-status" class="model-status-text">Waiting for marker…</span>
                <button id="next-btn-mobile" class="nav-btn nav-btn-inline" aria-label="Next model">&gt;</button>
            </div>
            <p class="ar-hint">Drag to rotate · Pinch to scale</p>
        </div>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ../assets/markers/targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" data-category="chair">
        <a-gltf-model
          class="furniture-model"
          data-category="chair"
          src="../assets/models/chair/chair_1.glb"
          position="0 0 0.1"
          scale="0.6 0.6 0.6"
          rotation="0 0 0"
          gesture-handler
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" data-category="sofa">
        <a-gltf-model
          class="furniture-model"
          data-category="sofa"
          src="../assets/models/sofa/sofa_1.glb"
          position="0 0 0.1"
          scale="0.6 0.6 0.6"
          rotation="0 0 0"
          gesture-handler
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2" data-category="cupboard">
        <a-gltf-model
          class="furniture-model"
          data-category="cupboard"
          src="../assets/models/cupboard/cupboard_1.glb"
          position="0 0 0.1"
          scale="0.6 0.6 0.6"
          rotation="0 0 0"
          gesture-handler
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3" data-category="table">
        <a-gltf-model
          class="furniture-model"
          data-category="table"
          src="../assets/models/table/table_1.glb"
          position="0 0 0.1"
          scale="0.6 0.6 0.6"
          rotation="0 0 0"
          gesture-handler
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
